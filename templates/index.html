<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гомоку · 5 в ряд</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        body {
            background: linear-gradient(145deg, #1e3c2c 0%, #2a5a3a 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .game-container {
            background: #d9b382;
            background-image: radial-gradient(circle, #e6c9a8 0%, #b58b5c 100%);
            padding: 2rem 2rem 1.8rem;
            border-radius: 48px;
            box-shadow: 0 25px 35px rgba(0,0,0,0.5), inset 0 1px 4px rgba(255,255,200,0.6);
            border: 2px solid #aa7e54;
        }
        h1 {
            text-align: center;
            margin: 0 0 10px 0;
            font-weight: 500;
            color: #fcf9e6;
            text-shadow: 3px 3px 0 #3b281a;
            letter-spacing: 3px;
            word-spacing: 6px;
            font-size: 2.3rem;
        }
        .mode-bar {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-bottom: 20px;
        }
        .mode-btn {
            background: #3e2c1b;
            border: none;
            color: #eedbba;
            font-weight: bold;
            font-size: 1.2rem;
            padding: 8px 24px;
            border-radius: 40px;
            box-shadow: 0 5px 0 #1f140c, 0 2px 8px black;
            cursor: pointer;
            transition: all 0.1s ease;
            border: 1px solid #cbad7a;
            letter-spacing: 1px;
        }
        .mode-btn.active {
            background: #c49a6c;
            color: #1e2f1e;
            box-shadow: 0 2px 0 #1f140c, 0 2px 6px black;
            transform: translateY(3px);
            border-color: #fbeebe;
        }
        .board-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 12px;
        }
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 16px;
            box-shadow: inset 0 0 0 2px #b28246, 0 18px 18px -6px rgba(0,0,0,0.5);
            background: #ecd5b0;
            cursor: pointer;
            transition: box-shadow 0.1s;
        }
        canvas:active {
            box-shadow: inset 0 0 0 2px #b28246, 0 8px 12px -4px black;
        }
        .info-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 16px 8px 0;
            color: #281e12;
            font-weight: bold;
        }
        .turn-indicator {
            background: #32281b;
            padding: 8px 28px;
            border-radius: 50px;
            color: #f3deba;
            box-shadow: inset 0 2px 4px black, 0 4px 0 #1a130b;
            font-size: 1.4rem;
            border-bottom: 2px solid #b4915b;
        }
        .restart-btn {
            background: #bc8f4b;
            border: none;
            font-weight: bold;
            font-size: 1.3rem;
            padding: 8px 28px;
            border-radius: 50px;
            box-shadow: 0 5px 0 #6a4e2e, 0 2px 8px black;
            cursor: pointer;
            color: #1e2a14;
            transition: 0.08s;
            border: 1px solid #f3dbb5;
        }
        .restart-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #6a4e2e, 0 2px 6px black;
        }
        .message {
            font-size: 1.2rem;
            background: #efe1c6;
            padding: 4px 20px;
            border-radius: 40px;
            min-width: 160px;
            text-align: center;
            box-shadow: inset 0 1px 3px black;
        }
        footer {
            text-align: center;
            margin-top: 12px;
            color: #f2e0bf;
            font-weight: 500;
        }
    </style>
</head>
<body>
<div class="game-container">
    <h1>⚫ GOMOKU ⚪</h1>
    <div class="mode-bar">
        <button class="mode-btn active" data-mode="pvp">👥 Игрок vs Игрок</button>
        <button class="mode-btn" data-mode="bot">🤖 Игрок vs Бот</button>
    </div>
    <div class="board-wrapper">
        <canvas id="gomokuCanvas" width="600" height="600"></canvas>
    </div>
    <div class="info-panel">
        <div class="turn-indicator" id="turnIndicator">⚫ Ход чёрных</div>
        <div class="message" id="statusMsg">Сделайте ход</div>
        <button class="restart-btn" id="restartButton">🔄 Заново</button>
    </div>
    <footer>← Пять в ряд →</footer>
</div>

<script>
    (function(){
        "use strict";

        // ----- КОНФИГУРАЦИЯ -----
        const BOARD_SIZE = 15;
        const EMPTY = 0;
        const PLAYER_BLACK = 1;   // человек или игрок 1
        const PLAYER_WHITE = 2;   // бот или игрок 2

        let board = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(EMPTY));
        let currentPlayer = PLAYER_BLACK;       // 1 — чёрные, 2 — белые
        let gameOver = false;
        let winner = null;          // null / 1 / 2 / 'draw'
        let gameMode = 'pvp';       // 'pvp' или 'bot'
        let isBotThinking = false;

        // DOM элементы
        const canvas = document.getElementById('gomokuCanvas');
        const ctx = canvas.getContext('2d');
        const turnIndicator = document.getElementById('turnIndicator');
        const statusMsg = document.getElementById('statusMsg');
        const restartBtn = document.getElementById('restartButton');
        const modeBtns = document.querySelectorAll('.mode-btn');

        // ----- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ -----
        function getEmptyBoard() {
            return Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(EMPTY));
        }

        function resetGameState() {
            board = getEmptyBoard();
            currentPlayer = PLAYER_BLACK;
            gameOver = false;
            winner = null;
            isBotThinking = false;
            updateUI();
            drawBoard();
        }

        // Переключение режима
        function setGameMode(mode) {
            gameMode = mode;
            // Подсветка активной кнопки
            modeBtns.forEach(btn => {
                const m = btn.dataset.mode;
                if (m === mode) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            resetGameState();
        }

        // Обновление текста и индикатора
        function updateUI() {
            if (gameOver) {
                if (winner === PLAYER_BLACK) {
                    turnIndicator.textContent = '🏆 Победили чёрные!';
                    statusMsg.textContent = 'Игра окончена';
                } else if (winner === PLAYER_WHITE) {
                    turnIndicator.textContent = '🏆 Победили белые!';
                    statusMsg.textContent = 'Игра окончена';
                } else if (winner === 'draw') {
                    turnIndicator.textContent = '🤝 Ничья';
                    statusMsg.textContent = 'Доска заполнена';
                } else {
                    turnIndicator.textContent = '⏸️ Пауза';
                }
                return;
            }

            if (currentPlayer === PLAYER_BLACK) {
                turnIndicator.textContent = '⚫ Ход чёрных';
            } else {
                turnIndicator.textContent = '⚪ Ход белых';
            }

            if (gameMode === 'bot' && currentPlayer === PLAYER_WHITE && !gameOver) {
                statusMsg.textContent = '🤖 Бот думает...';
            } else {
                statusMsg.textContent = 'Ваш ход';
            }
        }

        // ----- ОТРИСОВКА ДОСКИ -----
        function drawBoard() {
            const w = canvas.width;
            const h = canvas.height;
            const cellSize = w / BOARD_SIZE;
            const margin = cellSize * 0.5;
            const stoneRadius = cellSize * 0.4;

            // Фон доски (под дерево)
            ctx.fillStyle = '#ecd5b0';
            ctx.fillRect(0, 0, w, h);

            // Сетка
            ctx.lineWidth = 1.8;
            ctx.strokeStyle = '#3a2819';
            // Вертикальные линии
            for (let i = 0; i < BOARD_SIZE; i++) {
                const pos = i * cellSize + margin;
                ctx.beginPath();
                ctx.moveTo(pos, margin);
                ctx.lineTo(pos, h - margin);
                ctx.stroke();
            }
            // Горизонтальные линии
            for (let i = 0; i < BOARD_SIZE; i++) {
                const pos = i * cellSize + margin;
                ctx.beginPath();
                ctx.moveTo(margin, pos);
                ctx.lineTo(w - margin, pos);
                ctx.stroke();
            }

            // Звёздочки (хаши) — традиционные точки на доске 15x15
            const starPoints = [3, 7, 11]; // индексы для 15x15 (5-dan)
            ctx.fillStyle = '#3a2819';
            starPoints.forEach(r => {
                starPoints.forEach(c => {
                    ctx.beginPath();
                    ctx.arc(c * cellSize + margin, r * cellSize + margin, cellSize*0.1, 0, 2*Math.PI);
                    ctx.fill();
                });
            });
            // Дополнительные точки по бокам
            [[3,11],[11,3],[11,11],[7,7]].forEach(([r,c])=>{
                ctx.beginPath();
                ctx.arc(c * cellSize + margin, r * cellSize + margin, cellSize*0.08, 0, 2*Math.PI);
                ctx.fill();
            });

            // Камни
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if (board[r][c] === EMPTY) continue;
                    const x = c * cellSize + margin;
                    const y = r * cellSize + margin;

                    // Градиент для объёма
                    const gradient = ctx.createRadialGradient(x-4, y-4, 2, x, y, stoneRadius+2);
                    if (board[r][c] === PLAYER_BLACK) {
                        gradient.addColorStop(0, '#1f1f1f');
                        gradient.addColorStop(0.7, '#333333');
                        gradient.addColorStop(1, '#111111');
                        ctx.shadowColor = '#aaa';
                    } else {
                        gradient.addColorStop(0, '#f9f9fa');
                        gradient.addColorStop(0.5, '#e0e0e0');
                        gradient.addColorStop(1, '#b0b0b0');
                        ctx.shadowColor = '#ddd';
                    }
                    ctx.shadowBlur = 8;
                    ctx.shadowOffsetX = 1;
                    ctx.shadowOffsetY = 1;

                    ctx.beginPath();
                    ctx.arc(x, y, stoneRadius, 0, 2 * Math.PI);
                    ctx.fillStyle = gradient;
                    ctx.fill();
                    ctx.shadowBlur = 0; // сброс тени
                    ctx.strokeStyle = '#4d3e2e';
                    ctx.lineWidth = 1.2;
                    ctx.stroke();
                }
            }
            // Если есть победитель, можно подсветить (не обязательно)
        }

        // ----- ОТПРАВКА ХОДА НА СЕРВЕР -----
        async function sendMove(row, col) {
            try {
                const response = await fetch('/api/move', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        board: board,
                        row: row,
                        col: col,
                        player: currentPlayer,
                        gameMode: gameMode
                    })
                });
                if (!response.ok) {
                    const err = await response.json();
                    alert(err.error || 'Ошибка хода');
                    return false;
                }
                const data = await response.json();
                // Обновляем доску с сервера
                board = data.board;

                // Проверка результата
                if (data.winner) {
                    gameOver = true;
                    winner = data.winner;
                } else if (data.draw) {
                    gameOver = true;
                    winner = 'draw';
                } else {
                    // Смена игрока
                    currentPlayer = (currentPlayer === PLAYER_BLACK) ? PLAYER_WHITE : PLAYER_BLACK;
                }

                // Если был ход бота, он уже сделан, но убедимся что currentPlayer верный
                if (gameMode === 'bot' && data.botMove && !data.winner && !data.draw) {
                    // бот походил, значит очередь снова чёрных
                    currentPlayer = PLAYER_BLACK;
                }

                drawBoard();
                updateUI();

                // Проверка: не нужно ли боту ходить автоматически (если после хода человека игра не закончилась и сейчас ход бота)
                if (gameMode === 'bot' && !gameOver && currentPlayer === PLAYER_WHITE && !isBotThinking) {
                    // вызываем бота
                    makeBotMove();
                }
                return true;
            } catch (error) {
                console.error('Ошибка сети:', error);
                alert('Проблема соединения с сервером');
                return false;
            }
        }

        // Ход бота (вызывается, когда ход белых и режим bot)
        async function makeBotMove() {
            if (isBotThinking || gameOver || currentPlayer !== PLAYER_WHITE || gameMode !== 'bot') return;
            isBotThinking = true;
            updateUI(); // покажет "Бот думает"

            // Имитация небольшой задержки, чтобы не дёргалось
            setTimeout(async () => {
                try {
                    const response = await fetch('/api/move', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            board: board,
                            row: -1,   // сигнал "бот, сделай ход"
                            col: -1,
                            player: PLAYER_WHITE,
                            gameMode: 'bot'
                        })
                    });
                    const data = await response.json();
                    board = data.board;
                    if (data.winner) {
                        gameOver = true;
                        winner = data.winner;
                    } else if (data.draw) {
                        gameOver = true;
                        winner = 'draw';
                    } else {
                        currentPlayer = PLAYER_BLACK;
                    }
                    drawBoard();
                    updateUI();
                } catch (e) {
                    alert('Ошибка хода бота');
                } finally {
                    isBotThinking = false;
                }
            }, 120);
        }

        // ----- ОБРАБОТЧИК КЛИКОВ ПО КАНВАСУ -----
        function handleCanvasClick(e) {
            if (gameOver) return;
            if (gameMode === 'bot' && currentPlayer === PLAYER_WHITE) {
                statusMsg.textContent = 'Сейчас ход бота';
                return;
            }
            if (isBotThinking) return;

            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            const canvasX = (e.clientX - rect.left) * scaleX;
            const canvasY = (e.clientY - rect.top) * scaleY;

            const cellSize = canvas.width / BOARD_SIZE;
            const margin = cellSize / 2;

            let col = Math.floor((canvasX - margin/2) / cellSize);
            let row = Math.floor((canvasY - margin/2) / cellSize);

            if (row < 0 || row >= BOARD_SIZE || col < 0 || col >= BOARD_SIZE) return;
            if (board[row][col] !== EMPTY) {
                statusMsg.textContent = 'Клетка занята';
                return;
            }

            // Отправляем ход
            sendMove(row, col);
        }

        // Перезапуск
        function restartGame() {
            resetGameState();
            drawBoard();
        }

        // ----- ИНИЦИАЛИЗАЦИЯ -----
        function init() {
            resetGameState();
            drawBoard();

            canvas.addEventListener('click', handleCanvasClick);
            restartBtn.addEventListener('click', restartGame);

            modeBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const mode = e.currentTarget.dataset.mode;
                    setGameMode(mode);
                });
            });
        }

        init();
    })();
</script>
</body>
</html>
